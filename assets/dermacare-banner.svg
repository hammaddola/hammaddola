  <circle cx="1020" cy="300" r="380" fill="url(#a1)"/>
  <circle cx="1180" cy="80" r="300" fill="url(#a2)"/>
  <circle cx="180" cy="620" r="360" fill="url(#a3)"/>
  <!-- scan rings echoing the in-app orb -->
  <g fill="none" stroke="#4FD1C1">
    <circle cx="1030" cy="310" r="150" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1030" cy="310" r="210" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 12"/>
    <circle cx="1030" cy="310" r="270" stroke-opacity="0.12" stroke-width="2"/>
  </g>
  <svg x="905" y="185" width="250" height="250" viewBox="0 0 1024 1024">  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071D36"/>
      <stop offset="0.55" stop-color="#0B2A4A"/>
      <stop offset="1" stop-color="#123E73"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#4FD1C1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4FD1C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdrop" x1="0.25" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8FEADF"/>
      <stop offset="0.45" stop-color="#2FB5A6"/>
      <stop offset="1" stop-color="#0A6E66"/>
    </linearGradient>
    <linearGradient id="bbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1C1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9F5EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#4FD1C1" stop-opacity="0"/>
    </linearGradient>
    <filter id="bblur" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bbg)"/>
  <circle cx="512" cy="560" r="400" fill="url(#bglow)"/>

  <!-- scanner viewfinder -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92">
