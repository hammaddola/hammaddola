<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">DermaCare: AI skin screening and verified dermatologists</title>
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061629"/><stop offset="0.5" stop-color="#0B2A4A"/><stop offset="1" stop-color="#123E73"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0B7F75" stop-opacity="0.55"/><stop offset="1" stop-color="#0B7F75" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5B47B0" stop-opacity="0.35"/><stop offset="1" stop-color="#5B47B0" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1D6FD8" stop-opacity="0.4"/><stop offset="1" stop-color="#1D6FD8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
