  <path d="M512 300 C590 400 660 470 660 576 A148 148 0 0 1 364 576 C364 470 434 400 512 300 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
  <ellipse cx="458" cy="470" rx="34" ry="62" transform="rotate(28 458 470)" fill="#FFFFFF" fill-opacity="0.35"/>
  <path d="M512 532 V652 M452 592 H572" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>

