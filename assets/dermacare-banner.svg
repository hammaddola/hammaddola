  <rect x="262" y="640" width="500" height="26" rx="13" fill="url(#bbeam)" filter="url(#bblur)" opacity="0.9"/>
  <rect x="282" y="649" width="460" height="8" rx="4" fill="url(#bbeam)"/>
</svg>
  <text x="96" y="150" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#4FD1C1" letter-spacing="4">DERMATOLOGY · TELEMEDICINE · AI</text>
  <text x="92" y="262" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-3"><tspan fill="#FFFFFF">Derma</tspan><tspan fill="#4FD1C1">Care</tspan></text>
  <text x="96" y="330" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="500" fill="#DCE7F3">Know your skin in a minute.</text>
  <text x="96" y="378" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="500" fill="#DCE7F3">Get a licence-verified dermatologist on it.</text>
  <g transform="translate(96 470)"><rect width="246" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/><circle cx="24" cy="26" r="5" fill="#4FD1C1"/><text x="40" y="34" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#DCE7F3">AI skin screening</text></g><g transform="translate(356 470)"><rect width="326" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/><circle cx="24" cy="26" r="5" fill="#4FD1C1"/><text x="40" y="34" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#DCE7F3">Licence-verified doctors</text></g><g transform="translate(695 470)"><rect width="326" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/><circle cx="24" cy="26" r="5" fill="#4FD1C1"/><text x="40" y="34" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#DCE7F3">Video &amp; in-person visits</text></g>
  <text x="96" y="590" font-family="'Poppins','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#7F93AB">Flutter · Supabase · Gemini · TensorFlow — screening support, not a medical diagnosis</text>
</svg>
